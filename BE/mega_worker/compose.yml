services:
  worker:
    build: .
    restart: unless-stopped
    env_file: .env.worker
    volumes:
      - mega_data:/data
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 768m
    init: true
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      MEGA_WORKER_DOMAIN: ${MEGA_WORKER_DOMAIN:?Imposta il dominio del servizio MEGA}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - worker
volumes:
  mega_data:
  caddy_data:
  caddy_config:
